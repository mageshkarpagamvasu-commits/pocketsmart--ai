{% set rows = recs if recs is defined else recent %}
{% if rows %}
<table>
  <tr><th>#</th><th>Category</th><th>Budget</th><th>Date</th><th></th></tr>
  {% for r in rows %}
  <tr><td>{{ r.id }}</td><td>{{ r.category|title }}</td><td>₹{{ r.budget|inr }}</td><td>{{ r.created_at }}</td>
      <td><a href="/recommendations-details/{{ r.id }}">View</a></td></tr>
  {% endfor %}
</table>
{% else %}<p class="muted">No plans yet — try a planner above.</p>{% endif %}
