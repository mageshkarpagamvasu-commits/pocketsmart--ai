<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PocketSmart AI{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="/">💰 PocketSmart AI</a>
  <nav>
    {% if user %}
      <a href="/dashboard">Dashboard</a><a href="/home-planner">Home</a><a href="/party-planner">Party</a>
      <a href="/jewelry-planner">Jewelry</a><a href="/history">History</a>
      <a href="/logout">Logout ({{ user.username }})</a>
    {% else %}
      <a href="/login">Login</a><a class="btn" href="/register">Get started</a>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>PocketSmart AI · College project · Built with FastAPI + Gemini</footer>
</body>
</html>
